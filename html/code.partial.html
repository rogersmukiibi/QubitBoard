<div id="code-panel" class="qb-code-panel" style="display: none">
    <style>
        .qb-code-panel {
            --qb-code-bg: #fff;
            --qb-code-border: #bbb;
            --qb-code-shadow: rgba(0, 0, 0, 0.08);
            --qb-code-hint: #888;
            --qb-code-dirty: #a66b00;
            --qb-code-error: #c00;
            --qb-code-divider: #ddd;
            --qb-code-body-bg: #fafafa;
            --qb-code-gutter-fg: #999;
            --qb-code-gutter-bg: #f0f0f0;
            --qb-code-error-mark: #d33;
            --qb-code-text: #222;
            --qb-code-caret: #000;
            --qb-code-selection: rgba(0, 120, 215, 0.25);
            --qb-code-error-line-bg: rgba(221, 51, 51, 0.08);
            --qb-tok-cm: #8a8a8a;
            --qb-tok-pragma: #7a4fb0;
            --qb-tok-kw: #0033b3;
            --qb-tok-ctl: #a0522d;
            --qb-tok-wire: #067d17;
            --qb-tok-arg: #b35900;
            --qb-tok-num: #1750eb;
            --qb-tok-str: #8c6c00;
        }
        /* Keep the two dark blocks the same. */
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) .qb-code-panel {
                --qb-code-bg: #1f1f22;
                --qb-code-border: #3a3a40;
                --qb-code-shadow: rgba(0, 0, 0, 0.4);
                --qb-code-hint: #9a9aa2;
                --qb-code-dirty: #e0a040;
                --qb-code-error: #ff6b6b;
                --qb-code-divider: #333338;
                --qb-code-body-bg: #1b1b1d;
                --qb-code-gutter-fg: #77777f;
                --qb-code-gutter-bg: #232327;
                --qb-code-error-mark: #e05555;
                --qb-code-text: #dcdcdf;
                --qb-code-caret: #fff;
                --qb-code-selection: rgba(80, 150, 230, 0.35);
                --qb-code-error-line-bg: rgba(255, 90, 90, 0.12);
                --qb-tok-cm: #7f848e;
                --qb-tok-pragma: #c49be8;
                --qb-tok-kw: #6cb6ff;
                --qb-tok-ctl: #e5a06a;
                --qb-tok-wire: #7ccf83;
                --qb-tok-arg: #f0a35c;
                --qb-tok-num: #79b8ff;
                --qb-tok-str: #d9c26a;
            }
        }
        :root[data-theme="dark"] .qb-code-panel {
            --qb-code-bg: #1f1f22;
            --qb-code-border: #3a3a40;
            --qb-code-shadow: rgba(0, 0, 0, 0.4);
            --qb-code-hint: #9a9aa2;
            --qb-code-dirty: #e0a040;
            --qb-code-error: #ff6b6b;
            --qb-code-divider: #333338;
            --qb-code-body-bg: #1b1b1d;
            --qb-code-gutter-fg: #77777f;
            --qb-code-gutter-bg: #232327;
            --qb-code-error-mark: #e05555;
            --qb-code-text: #dcdcdf;
            --qb-code-caret: #fff;
            --qb-code-selection: rgba(80, 150, 230, 0.35);
            --qb-code-error-line-bg: rgba(255, 90, 90, 0.12);
            --qb-tok-cm: #7f848e;
            --qb-tok-pragma: #c49be8;
            --qb-tok-kw: #6cb6ff;
            --qb-tok-ctl: #e5a06a;
            --qb-tok-wire: #7ccf83;
            --qb-tok-arg: #f0a35c;
            --qb-tok-num: #79b8ff;
            --qb-tok-str: #d9c26a;
        }
        .qb-code-panel {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--qb-code-bg);
            border-top: 1px solid var(--qb-code-border);
            box-shadow: 0 -2px 6px var(--qb-code-shadow);
            font-family: sans-serif;
            font-size: 13px;
        }
        .qb-code-resize {
            height: 6px;
            margin-top: -3px;
            cursor: ns-resize;
            touch-action: none;
        }
        .qb-code-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 3px 8px 5px 8px;
            flex-wrap: wrap;
        }
        .qb-code-header button,
        .qb-code-header select {
            min-height: 26px;
        }
        .qb-code-toggle {
            min-width: 70px;
            text-align: left;
        }
        .qb-code-hint {
            color: var(--qb-code-hint);
        }
        .qb-code-status {
            margin-left: auto;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }
        .qb-code-status-synced { color: var(--qb-code-hint); }
        .qb-code-status-dirty { color: var(--qb-code-dirty); }
        .qb-code-status-error { color: var(--qb-code-error); font-weight: bold; }
        .qb-code-body {
            display: flex;
            border-top: 1px solid var(--qb-code-divider);
            background: var(--qb-code-body-bg);
        }
        .qb-code-gutter,
        .qb-code-highlight,
        .qb-code-text {
            font-family: Consolas, Menlo, "DejaVu Sans Mono", monospace;
            font-size: 13px;
            line-height: 18px;
            tab-size: 4;
        }
        .qb-code-gutter {
            flex: none;
            min-width: 32px;
            padding: 6px 6px 6px 4px;
            overflow: hidden;
            text-align: right;
            color: var(--qb-code-gutter-fg);
            background: var(--qb-code-gutter-bg);
            border-right: 1px solid var(--qb-code-divider);
            user-select: none;
        }
        .qb-code-error-number {
            color: #fff;
            background: var(--qb-code-error-mark);
            border-radius: 2px;
        }
        .qb-code-scroll {
            position: relative;
            flex: 1;
            min-width: 0;
        }
        .qb-code-highlight,
        .qb-code-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 6px 8px;
            border: 0;
            box-sizing: border-box;
            white-space: pre;
            overflow: auto;
        }
        .qb-code-highlight {
            overflow: hidden;
            color: var(--qb-code-text);
            pointer-events: none;
        }
        .qb-code-text {
            color: transparent;
            background: transparent;
            caret-color: var(--qb-code-caret);
            resize: none;
            outline: none;
        }
        .qb-code-text::selection {
            background: var(--qb-code-selection);
        }
        .qb-code-error-line {
            text-decoration: underline wavy var(--qb-code-error-mark);
            background: var(--qb-code-error-line-bg);
        }
        .qb-tok-cm { color: var(--qb-tok-cm); font-style: italic; }
        .qb-tok-pragma { color: var(--qb-tok-pragma); }
        .qb-tok-kw { color: var(--qb-tok-kw); font-weight: bold; }
        .qb-tok-ctl { color: var(--qb-tok-ctl); }
        .qb-tok-wire { color: var(--qb-tok-wire); }
        .qb-tok-arg { color: var(--qb-tok-arg); }
        .qb-tok-num { color: var(--qb-tok-num); }
        .qb-tok-str { color: var(--qb-tok-str); }
    </style>
    <div id="code-panel-resize" class="qb-code-resize" title="Drag to resize"></div>
    <div class="qb-code-header">
        <button id="code-panel-toggle" class="qb-code-toggle" aria-controls="code-panel-body" aria-expanded="true">▾ Code</button>
        <select id="code-panel-language" aria-label="Code language"></select>
        <button id="code-panel-run" title="Apply the code to the circuit (Ctrl+Enter)">▶ Run</button>
        <span class="qb-code-hint">Ctrl+Enter</span>
        <button id="code-panel-copy">Copy</button>
        <span id="code-panel-status" class="qb-code-status" role="status"></span>    </div>
    <div id="code-panel-body" class="qb-code-body">
        <div id="code-panel-gutter" class="qb-code-gutter" aria-hidden="true"></div>
        <div class="qb-code-scroll">
            <pre id="code-panel-highlight" class="qb-code-highlight" aria-hidden="true"></pre>
            <textarea id="code-panel-text" class="qb-code-text" aria-label="Circuit code" spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off"></textarea>
        </div>
    </div>
</div>
