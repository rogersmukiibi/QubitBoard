<div id="code-panel" class="qb-code-panel" style="display: none">
    <style>
        .qb-code-panel {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background: #fff;
            border-top: 1px solid #bbb;
            box-shadow: 0 -2px 6px rgba(0, 0, 0, 0.08);
            font-family: sans-serif;
            font-size: 13px;
        }
        .qb-code-resize {
            height: 6px;
            margin-top: -3px;
            cursor: ns-resize;
            touch-action: none;
        }
        .qb-code-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 3px 8px 5px 8px;
            flex-wrap: wrap;
        }
        .qb-code-header button,
        .qb-code-header select {
            min-height: 26px;
        }
        .qb-code-toggle {
            min-width: 70px;
            text-align: left;
        }
        .qb-code-hint {
            color: #888;
        }
        .qb-code-status {
            margin-left: auto;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }
        .qb-code-status-synced { color: #888; }
        .qb-code-status-dirty { color: #a66b00; }
        .qb-code-status-error { color: #c00; font-weight: bold; }
        .qb-code-body {
            display: flex;
            border-top: 1px solid #ddd;
            background: #fafafa;
        }
        .qb-code-gutter,
        .qb-code-highlight,
        .qb-code-text {
            font-family: Consolas, Menlo, "DejaVu Sans Mono", monospace;
            font-size: 13px;
            line-height: 18px;
            tab-size: 4;
        }
        .qb-code-gutter {
            flex: none;
            min-width: 32px;
            padding: 6px 6px 6px 4px;
            overflow: hidden;
            text-align: right;
            color: #999;
            background: #f0f0f0;
            border-right: 1px solid #ddd;
            user-select: none;
        }
        .qb-code-error-number {
            color: #fff;
            background: #d33;
            border-radius: 2px;
        }
        .qb-code-scroll {
            position: relative;
            flex: 1;
            min-width: 0;
        }
        .qb-code-highlight,
        .qb-code-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 6px 8px;
            border: 0;
            box-sizing: border-box;
            white-space: pre;
            overflow: auto;
        }
        .qb-code-highlight {
            overflow: hidden;
            color: #222;
            pointer-events: none;
        }
        .qb-code-text {
            color: transparent;
            background: transparent;
            caret-color: #000;
            resize: none;
            outline: none;
        }
        .qb-code-text::selection {
            background: rgba(0, 120, 215, 0.25);
        }
        .qb-code-error-line {
            text-decoration: underline wavy #d33;
            background: rgba(221, 51, 51, 0.08);
        }
        .qb-tok-cm { color: #8a8a8a; font-style: italic; }
        .qb-tok-pragma { color: #7a4fb0; }
        .qb-tok-kw { color: #0033b3; font-weight: bold; }
        .qb-tok-ctl { color: #a0522d; }
        .qb-tok-wire { color: #067d17; }
        .qb-tok-arg { color: #b35900; }
        .qb-tok-num { color: #1750eb; }
        .qb-tok-str { color: #8c6c00; }
    </style>
    <div id="code-panel-resize" class="qb-code-resize" title="Drag to resize"></div>
    <div class="qb-code-header">
        <button id="code-panel-toggle" class="qb-code-toggle" aria-controls="code-panel-body" aria-expanded="true">▾ Code</button>
        <select id="code-panel-language" aria-label="Code language"></select>
        <button id="code-panel-run" title="Apply the code to the circuit (Ctrl+Enter)">▶ Run</button>
        <span class="qb-code-hint">Ctrl+Enter</span>
        <button id="code-panel-copy">Copy</button>
        <span id="code-panel-status" class="qb-code-status" role="status"></span>
    </div>
    <div id="code-panel-body" class="qb-code-body">
        <div id="code-panel-gutter" class="qb-code-gutter" aria-hidden="true"></div>
        <div class="qb-code-scroll">
            <pre id="code-panel-highlight" class="qb-code-highlight" aria-hidden="true"></pre>
            <textarea id="code-panel-text" class="qb-code-text" aria-label="Circuit code" spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off"></textarea>
        </div>
    </div>
</div>
