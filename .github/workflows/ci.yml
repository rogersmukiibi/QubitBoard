name: ci
on: [push, pull_request]
jobs:
  build-and-run-unit-tests:
    runs-on: ubuntu-latest
    env:
      # ubuntu-latest restricts unprivileged user namespaces, which the bundled Chromium
      # needs for its sandbox. The runner is ephemeral and only loads our own build.
      PUPPETEER_NO_SANDBOX: '1'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - run: npm ci
    - run: npx grunt build-test-page
    - run: node PuppeteerRunTests.js
  screenshot-circuit:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_NO_SANDBOX: '1'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - run: npm ci
    - run: npm run build
    - run: node PuppeteerScreenshotCircuit.js
    - uses: actions/upload-artifact@v4
      with:
        name: screenshot
        path: screenshot.png
